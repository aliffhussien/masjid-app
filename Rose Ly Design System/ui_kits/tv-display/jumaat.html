<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <title>Rose Ly · TV Display · Jumaat Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;300;400;500;700;900&family=Cairo:wght@200;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/svg-clock.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #010103; color: white;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .stage-wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #010103; overflow: hidden;
    }
    .stage {
      width: 1920px; height: 1080px;
      position: relative; overflow: hidden;
      transform-origin: center center;
      background: #010103;
    }
    .vfx-grain {
      position: absolute; inset: 0; pointer-events: none; z-index: 9999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      opacity: 0.025;
    }
    .vfx-vignette {
      position: absolute; inset: 0; pointer-events: none; z-index: 9998;
      background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.4) 100%);
    }
  </style>
</head>
<body>
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div id="app"></div>
      <div class="vfx-grain"></div>
      <div class="vfx-vignette"></div>
    </div>
  </div>
  <script type="module" src="/ui_kits/tv-display/main_jumaat.jsx"></script>
  <script type="module">
    function fitStage() {
      const stage = document.getElementById('stage');
      if (!stage) return;
      const w = window.innerWidth  || document.documentElement.clientWidth;
      const h = window.innerHeight || document.documentElement.clientHeight;
      const scale = Math.min(w / 1920, h / 1080);
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fitStage);
    window.addEventListener('load',   fitStage);
    if (window.ResizeObserver) new ResizeObserver(fitStage).observe(document.documentElement);
    fitStage();
    setTimeout(fitStage, 50);
    setTimeout(fitStage, 300);
  </script>
</body>
</html>
