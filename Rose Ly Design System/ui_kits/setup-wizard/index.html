<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <title>Rose Ly · Setup Wizard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0a0610;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      color: white; -webkit-font-smoothing: antialiased;
    }

    /* Same phone-frame wrapper as mobile-admin so previews look consistent */
    .frame-wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(244,63,94,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(74,35,73,0.20) 0%, transparent 60%),
        #14091a;
      padding: 16px;
    }
    .frame {
      position: relative;
      width: 412px; height: 900px;
      border-radius: 50px;
      background: #14091a;
      box-shadow:
        0 0 0 12px #18181b,
        0 0 0 14px #27272a,
        0 50px 120px rgba(0,0,0,0.7);
      overflow: hidden;
    }
    .frame::before {
      content: ''; position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      width: 100px; height: 22px; background: #000; border-radius: 999px; z-index: 100;
    }
    .app-area {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 90px 24px 40px;
    }
    .app-area > * { width: 100%; display: flex; align-items: center; justify-content: center; }

    @keyframes rl-fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-height: 940px) {
      .frame { transform: scale(calc((100vh - 32px) / 900)); transform-origin: center center; }
    }
    @media (max-width: 460px) {
      .frame { transform: scale(calc((100vw - 32px) / 412)); transform-origin: center center; }
    }
  </style>
</head>
<body>
  <div class="frame-wrap">
    <div class="frame">
      <div class="app-area" id="app"></div>
    </div>
  </div>

  <script type="module" src="/ui_kits/setup-wizard/main.jsx"></script>
</body>
</html>
