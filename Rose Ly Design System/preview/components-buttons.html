<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:240px">
  <div class="card">
    <div class="label" style="margin-bottom:14px">Buttons</div>
    <div style="display:flex; flex-direction:column; gap:14px; max-width:520px">
      <button style="font-family:inherit; font-weight:900; text-transform:uppercase; letter-spacing:0.2em; font-size:13px; padding:18px; background:#059669; color:white; border-radius:24px; border:none; cursor:pointer; box-shadow: 0 12px 30px rgba(2,44,34,0.6); display:flex; align-items:center; justify-content:center; gap:10px">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>
        Cari Masjid Saya
      </button>
      <div style="display:flex; gap:10px">
        <button style="flex:1; font-family:inherit; font-weight:900; text-transform:uppercase; letter-spacing:0.2em; font-size:11px; padding:14px; background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.05); border-radius:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
          Keluar
        </button>
        <button style="flex:1; font-family:inherit; font-weight:900; text-transform:uppercase; letter-spacing:0.2em; font-size:11px; padding:14px; background:#3b82f6; color:white; border:none; border-radius:16px; cursor:pointer">Sambungkan</button>
        <button style="flex:1; font-family:inherit; font-weight:900; text-transform:uppercase; letter-spacing:0.2em; font-size:11px; padding:14px; background:rgba(244,63,94,0.15); color:#fda4af; border:1px solid rgba(244,63,94,0.3); border-radius:16px; cursor:pointer">Padam</button>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button style="font-family:inherit; font-weight:900; text-transform:uppercase; letter-spacing:0.1em; font-size:10px; padding:8px 14px; background:#059669; color:white; border:1px solid #10b981; border-radius:12px; cursor:pointer">5 Saat</button>
        <button style="font-family:inherit; font-weight:900; text-transform:uppercase; letter-spacing:0.1em; font-size:10px; padding:8px 14px; background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.08); border-radius:12px; cursor:pointer">8 Saat</button>
        <button style="font-family:inherit; font-weight:900; text-transform:uppercase; letter-spacing:0.1em; font-size:10px; padding:8px 14px; background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.08); border-radius:12px; cursor:pointer">12 Saat</button>
        <button style="font-family:inherit; font-weight:900; text-transform:uppercase; letter-spacing:0.1em; font-size:10px; padding:8px 14px; background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.08); border-radius:12px; cursor:pointer">20 Saat</button>
      </div>
    </div>
  </div>
</body></html>
