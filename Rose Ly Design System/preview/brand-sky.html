<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:240px; padding:0">
  <div class="card" style="position:relative; height:100%; border-radius:24px; overflow:hidden;
       background:
         radial-gradient(ellipse at 75% -10%, rgba(255,180,140,0.32), transparent 55%),
         radial-gradient(ellipse at 5% 110%, rgba(120,80,180,0.22), transparent 60%),
         linear-gradient(180deg, #2a1a45 0%, #0e1a2e 45%, #04060f 100%);">
    <!-- Moon -->
    <div style="position:absolute; top:32px; right:74px; width:46px; height:46px; border-radius:50%;
                background: radial-gradient(circle at 35% 35%, #fff8eb 0%, #f5dca3 60%, #c89e5a 100%);
                box-shadow: 0 0 60px rgba(255,220,160,0.4)"></div>
    <!-- Stars -->
    <div style="position:absolute; top:20%; left:8%;   width:2px;   height:2px;   background:white;  border-radius:50%; opacity:0.9"></div>
    <div style="position:absolute; top:35%; left:22%;  width:1.5px; height:1.5px; background:white;  border-radius:50%; opacity:0.55"></div>
    <div style="position:absolute; top:48%; left:12%;  width:2.5px; height:2.5px; background:#cfd8ff; border-radius:50%; opacity:0.95; box-shadow:0 0 6px #cfd8ff"></div>
    <div style="position:absolute; top:18%; left:48%;  width:1px;   height:1px;   background:white;  border-radius:50%; opacity:0.7"></div>
    <div style="position:absolute; top:62%; left:88%;  width:2px;   height:2px;   background:white;  border-radius:50%; opacity:0.8"></div>
    <div style="position:absolute; top:30%; left:78%;  width:1.5px; height:1.5px; background:white;  border-radius:50%; opacity:0.6"></div>
    <div style="position:absolute; top:42%; left:62%;  width:1px;   height:1px;   background:white;  border-radius:50%; opacity:0.6"></div>
    <div style="position:absolute; top:25%; left:36%;  width:1.5px; height:1.5px; background:white;  border-radius:50%; opacity:0.45"></div>
    <!-- Horizon -->
    <div style="position:absolute; left:0; right:0; top:62%; height:1px; background:linear-gradient(90deg,transparent,rgba(255,180,140,0.45),transparent)"></div>
    <!-- Sea glitter -->
    <div style="position:absolute; left:0; right:0; bottom:0; height:38%;
                background: radial-gradient(ellipse at 70% top, rgba(255,200,130,0.40) 0%, transparent 55%);
                mix-blend-mode: screen"></div>

    <!-- Caption -->
    <div style="position:absolute; left:32px; bottom:32px; right:32px">
      <div style="font-size:10px; font-weight:900; letter-spacing:0.4em; color:#fda4af; text-transform:uppercase;
                  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7))">Atmosphere</div>
      <div style="font-weight:900; font-size:30px; letter-spacing:-0.025em; line-height:1.1; text-transform:uppercase; margin-top:10px; max-width:520px;
                  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.7))">Every screen feels alive.</div>
      <div style="font-size:13px; font-weight:500; color:rgba(255,255,255,0.6); margin-top:8px; max-width:460px; line-height:1.45;
                  filter: drop-shadow(0 1px 4px rgba(0,0,0,0.7))">A living backdrop sits behind the dashboard — never flat, never static.</div>
    </div>
  </div>
</body></html>
