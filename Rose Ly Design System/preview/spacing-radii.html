<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:220px">
  <div class="card">
    <div class="label" style="margin-bottom:14px">Corner radii · big curves are the brand</div>
    <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap: 12px; align-items:end;">
      <div style="text-align:center">
        <div style="width:100%; height:90px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); border-radius:40px"></div>
        <div style="font-size:9px; font-weight:900; margin-top:8px; letter-spacing:0.15em">40px</div>
        <div class="dim" style="font-size:9px">panel</div>
      </div>
      <div style="text-align:center">
        <div style="width:100%; height:90px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); border-radius:24px"></div>
        <div style="font-size:9px; font-weight:900; margin-top:8px; letter-spacing:0.15em">24px</div>
        <div class="dim" style="font-size:9px">card</div>
      </div>
      <div style="text-align:center">
        <div style="width:100%; height:90px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); border-radius:16px"></div>
        <div style="font-size:9px; font-weight:900; margin-top:8px; letter-spacing:0.15em">16px</div>
        <div class="dim" style="font-size:9px">button · 2xl</div>
      </div>
      <div style="text-align:center">
        <div style="width:100%; height:90px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); border-radius:12px"></div>
        <div style="font-size:9px; font-weight:900; margin-top:8px; letter-spacing:0.15em">12px</div>
        <div class="dim" style="font-size:9px">prayer row</div>
      </div>
      <div style="text-align:center">
        <div style="width:100%; height:90px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); border-radius:9999px"></div>
        <div style="font-size:9px; font-weight:900; margin-top:8px; letter-spacing:0.15em">9999</div>
        <div class="dim" style="font-size:9px">pill · dot</div>
      </div>
    </div>
    <div style="margin-top:18px; font-size:11px; color:rgba(255,255,255,0.4)">
      Anything below <b style="color:rgba(255,255,255,0.6)">12px</b> looks off-brand. Reach for the next size up.
    </div>
  </div>
</body></html>
