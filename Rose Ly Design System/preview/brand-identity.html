<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:230px">
  <div class="card" style="display:flex; gap:20px; align-items:stretch">
    <!-- Aubergine -->
    <div style="flex:1; padding:18px; border-radius:22px; min-height:170px;
                background: linear-gradient(180deg,#4a2349 0%,#28132e 100%);
                box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
                display:flex; flex-direction:column; justify-content:space-between">
      <div>
        <div style="font-size:10px; font-weight:900; letter-spacing:0.3em; color:rgba(255,255,255,0.50); text-transform:uppercase">Aubergine</div>
        <div style="font-weight:900; font-size:22px; margin-top:4px; letter-spacing:-0.02em">The Surface</div>
      </div>
      <div style="font-size:11px; color:rgba(255,255,255,0.5); line-height:1.4">
        The tile, the wallpaper, the night sky. <span style="color:#c294c8; font-weight:900">#3a1c3a</span>
      </div>
    </div>
    <!-- Crimson -->
    <div style="flex:1; padding:18px; border-radius:22px; min-height:170px;
                background: linear-gradient(180deg,#a8254a 0%,#5a0e26 100%);
                box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
                display:flex; flex-direction:column; justify-content:space-between">
      <div>
        <div style="font-size:10px; font-weight:900; letter-spacing:0.3em; color:rgba(255,255,255,0.6); text-transform:uppercase">Crimson Rose</div>
        <div style="font-weight:900; font-size:22px; margin-top:4px; letter-spacing:-0.02em">The Voice</div>
      </div>
      <div style="font-size:11px; color:rgba(255,255,255,0.6); line-height:1.4">
        Every accent, every active state, every moment that matters. <span style="color:#fda4af; font-weight:900">#a8254a</span>
      </div>
    </div>
    <!-- Bone white -->
    <div style="flex:1; padding:18px; border-radius:22px; min-height:170px;
                background: linear-gradient(180deg,#fefcfb 0%,#f4ecee 100%); color:#1c1421;
                box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
                display:flex; flex-direction:column; justify-content:space-between">
      <div>
        <div style="font-size:10px; font-weight:900; letter-spacing:0.3em; color:rgba(28,20,33,0.45); text-transform:uppercase">Petal White</div>
        <div style="font-weight:900; font-size:22px; margin-top:4px; letter-spacing:-0.02em">The Words</div>
      </div>
      <div style="font-size:11px; color:rgba(28,20,33,0.55); line-height:1.4">
        Headlines, prayer names, countdown numerals. <span style="color:#5a0e26; font-weight:900">#fefcfb</span>
      </div>
    </div>
  </div>
</body></html>
