<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:200px">
  <div class="card">
    <div class="label" style="margin-bottom:14px">Pills & badges</div>
    <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center">
      <span style="padding:5px 14px; background:rgba(244,63,94,0.25); color:#fda4af; border:1px solid rgba(244,63,94,0.4); border-radius:999px; font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:0.15em">MAKLUMAN</span>
      <span style="padding:5px 14px; background:rgba(59,130,246,0.20); color:#93c5fd; border:1px solid rgba(59,130,246,0.3); border-radius:999px; font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:0.15em">BERITA</span>
      <span style="padding:5px 14px; background:rgba(16,185,129,0.15); color:#34d399; border:1px solid rgba(16,185,129,0.3); border-radius:999px; font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:0.15em">CLOUD AKTIF</span>
      <span style="padding:5px 14px; background:rgba(245,158,11,0.15); color:#fbbf24; border:1px solid rgba(245,158,11,0.3); border-radius:999px; font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:0.15em">PAUSE</span>
      <span style="padding:5px 14px; background:rgba(168,85,247,0.15); color:#c084fc; border:1px solid rgba(168,85,247,0.3); border-radius:999px; font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:0.15em">KHUTBAH</span>
      <span style="padding:5px 14px; background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.3); border:1px solid rgba(255,255,255,0.10); border-radius:999px; font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:0.15em">NORMAL</span>
    </div>
    <div style="margin-top:18px; display:flex; gap:14px; align-items:center; padding-top:14px; border-top:1px solid rgba(255,255,255,0.05)">
      <div style="display:flex; align-items:center; gap:8px">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#ef4444; box-shadow:0 0 12px #ef4444; animation:p 2s infinite"></span>
        <span style="font-size:10px; font-weight:900; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.6)">LIVE PREVIEW</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#10b981; box-shadow:0 0 10px rgba(16,185,129,0.8)"></span>
        <span style="font-size:10px; font-weight:900; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.6)">CLOUD SYNC AKTIF</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#3b82f6"></span>
        <span style="font-size:10px; font-weight:900; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.6)">MODE TEMPATAN</span>
      </div>
    </div>
  </div>
  <style>@keyframes p { 0%,100%{opacity:1} 50%{opacity:0.4} }</style>
</body></html>
