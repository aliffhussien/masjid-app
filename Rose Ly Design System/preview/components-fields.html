<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:240px">
  <div class="card">
    <div class="label" style="margin-bottom:14px">Form fields · admin</div>
    <div style="display:flex; flex-direction:column; gap:14px">
      <label style="display:block">
        <span style="font-size:9px; font-weight:900; color:rgba(255,255,255,0.3); text-transform:uppercase; letter-spacing:0.2em">Nama Masjid</span>
        <div style="margin-top:6px; padding:14px 18px; background:rgba(0,0,0,0.4); border:2px solid #10b981; border-radius:18px; font-size:14px; font-weight:700">Masjid Al-Falah</div>
      </label>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px">
        <label style="display:block">
          <span style="font-size:9px; font-weight:900; color:rgba(255,255,255,0.3); text-transform:uppercase; letter-spacing:0.2em">Jenis Slaid</span>
          <div style="margin-top:6px; padding:14px 18px; background:rgba(0,0,0,0.4); border:2px solid rgba(255,255,255,0.08); border-radius:18px; font-size:14px; font-weight:700; display:flex; justify-content:space-between; align-items:center">Makluman (Teks) <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="opacity:0.5"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg></div>
        </label>
        <label style="display:block">
          <span style="font-size:9px; font-weight:900; color:rgba(255,255,255,0.3); text-transform:uppercase; letter-spacing:0.2em">Label</span>
          <div style="margin-top:6px; padding:14px 18px; background:rgba(0,0,0,0.4); border:2px solid rgba(255,255,255,0.08); border-radius:18px; font-size:14px; font-weight:700; display:flex; justify-content:space-between; align-items:center">Info <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="opacity:0.5"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg></div>
        </label>
      </div>
      <div style="font-size:10px; color:rgba(255,255,255,0.35); margin-top:2px"><b style="color:#34d399">Focused state</b> uses <code>border-emerald-500</code> · 2px border · radius 18-24px</div>
    </div>
  </div>
</body></html>
