<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:280px">
  <div class="card">
    <div class="label" style="margin-bottom:14px">Toggles · 4-up</div>
    <div style="display:flex; flex-direction:column; gap:10px">
      <div style="display:flex; align-items:center; gap:14px; padding:14px 18px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.05); border-radius:20px">
        <span style="font-size:22px">📰</span>
        <div style="flex:1">
          <div style="font-weight:900; font-size:13px; text-transform:uppercase; letter-spacing:-0.015em">News</div>
          <div style="font-size:10px; color:rgba(255,255,255,0.3); font-weight:700">Berita dalam ticker</div>
        </div>
        <div style="width:40px; height:24px; background:#10b981; border-radius:999px; position:relative;">
          <div style="width:18px; height:18px; background:white; border-radius:50%; position:absolute; top:3px; right:3px"></div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:14px; padding:14px 18px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.05); border-radius:20px">
        <span style="font-size:22px">🌍</span>
        <div style="flex:1">
          <div style="font-weight:900; font-size:13px; text-transform:uppercase; letter-spacing:-0.015em">Jam Dunia</div>
          <div style="font-size:10px; color:rgba(255,255,255,0.3); font-weight:700">Jam pelbagai negara</div>
        </div>
        <div style="width:40px; height:24px; background:#10b981; border-radius:999px; position:relative;">
          <div style="width:18px; height:18px; background:white; border-radius:50%; position:absolute; top:3px; right:3px"></div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:14px; padding:14px 18px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.05); border-radius:20px">
        <span style="font-size:22px; filter:grayscale(0.6)">🔔</span>
        <div style="flex:1">
          <div style="font-weight:900; font-size:13px; text-transform:uppercase; letter-spacing:-0.015em; color:rgba(255,255,255,0.55)">Bunyi Beep</div>
          <div style="font-size:10px; color:rgba(255,255,255,0.25); font-weight:700">Beep 3× masa solat</div>
        </div>
        <div style="width:40px; height:24px; background:rgba(255,255,255,0.10); border-radius:999px; position:relative;">
          <div style="width:18px; height:18px; background:rgba(255,255,255,0.5); border-radius:50%; position:absolute; top:3px; left:3px"></div>
        </div>
      </div>
    </div>
  </div>
</body></html>
