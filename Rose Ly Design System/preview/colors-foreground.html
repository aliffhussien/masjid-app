<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:220px">
  <div class="card">
    <div class="label" style="margin-bottom:14px">Foreground · white opacity ladder</div>
    <div style="display:grid; grid-template-columns: repeat(8, 1fr); gap: 6px;">
      <div style="display:flex; flex-direction:column; align-items:center"><div style="width:100%; height:50px; background:#fff; border-radius:10px"></div><div style="font-size:9px; font-weight:900; margin-top:6px">100%</div><div class="dim" style="font-size:8px">fg-1</div></div>
      <div style="display:flex; flex-direction:column; align-items:center"><div style="width:100%; height:50px; background:rgba(255,255,255,0.65); border-radius:10px"></div><div style="font-size:9px; font-weight:900; margin-top:6px">65%</div><div class="dim" style="font-size:8px">fg-2</div></div>
      <div style="display:flex; flex-direction:column; align-items:center"><div style="width:100%; height:50px; background:rgba(255,255,255,0.40); border-radius:10px"></div><div style="font-size:9px; font-weight:900; margin-top:6px">40%</div><div class="dim" style="font-size:8px">fg-3</div></div>
      <div style="display:flex; flex-direction:column; align-items:center"><div style="width:100%; height:50px; background:rgba(255,255,255,0.30); border-radius:10px"></div><div style="font-size:9px; font-weight:900; margin-top:6px">30%</div><div class="dim" style="font-size:8px">fg-4</div></div>
      <div style="display:flex; flex-direction:column; align-items:center"><div style="width:100%; height:50px; background:rgba(255,255,255,0.20); border-radius:10px"></div><div style="font-size:9px; font-weight:900; margin-top:6px">20%</div><div class="dim" style="font-size:8px">fg-5</div></div>
      <div style="display:flex; flex-direction:column; align-items:center"><div style="width:100%; height:50px; background:rgba(255,255,255,0.15); border-radius:10px"></div><div style="font-size:9px; font-weight:900; margin-top:6px">15%</div><div class="dim" style="font-size:8px">fg-6</div></div>
      <div style="display:flex; flex-direction:column; align-items:center"><div style="width:100%; height:50px; background:rgba(255,255,255,0.10); border-radius:10px"></div><div style="font-size:9px; font-weight:900; margin-top:6px">10%</div><div class="dim" style="font-size:8px">fg-7</div></div>
      <div style="display:flex; flex-direction:column; align-items:center"><div style="width:100%; height:50px; background:rgba(255,255,255,0.05); border-radius:10px; border:1px solid rgba(255,255,255,0.1)"></div><div style="font-size:9px; font-weight:900; margin-top:6px">5%</div><div class="dim" style="font-size:8px">fg-8</div></div>
    </div>
    <div style="margin-top:16px; padding:10px 14px; background:rgba(255,255,255,0.04); border-radius:12px; font-size:11px; color:rgba(255,255,255,0.4); display:grid; grid-template-columns: repeat(4, 1fr); gap:8px">
      <span><b style="color:#fff">100</b> heading</span>
      <span><b style="color:rgba(255,255,255,0.65)">65</b> hadith</span>
      <span><b style="color:rgba(255,255,255,0.30)">30</b> meta</span>
      <span><b style="color:rgba(255,255,255,0.15)">15</b> watermark</span>
    </div>
  </div>
</body></html>
