<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:240px">
  <div class="card">
    <div class="label" style="margin-bottom:14px">TV layout grid · 1920×1080</div>
    <div style="display:grid; grid-template-columns: 1fr 180px; grid-template-rows: 56px 1fr 28px; gap:8px; height:140px; padding:6px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:16px">
      <div style="grid-column:1/-1; background:rgba(244,63,94,0.10); border:1px solid rgba(244,63,94,0.25); border-radius:14px; display:flex; align-items:center; padding:0 12px; gap:8px; font-size:9px; font-weight:900; letter-spacing:0.2em; color:#fda4af">
        <span style="display:inline-block; width:8px; height:14px; background:#f43f5e; border-radius:2px"></span>HEADER · 130PX
      </div>
      <div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:900; letter-spacing:0.2em; color:rgba(255,255,255,0.5)">MAIN · SLIDE ENGINE</div>
      <div style="background:rgba(16,185,129,0.10); border:1px solid rgba(16,185,129,0.25); border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:900; letter-spacing:0.15em; color:#6ee7b7; text-align:center; padding:0 6px">SIDE<br>420PX</div>
      <div style="grid-column:1/-1; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:8px; display:flex; align-items:center; padding:0 10px; font-size:9px; font-weight:900; letter-spacing:0.2em; color:rgba(255,255,255,0.5)">FOOTER · 60PX · TICKER + BRAND</div>
    </div>
    <div style="margin-top:14px; display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; font-size:10px; color:rgba(255,255,255,0.5)">
      <div><span class="dim" style="font-weight:900; font-size:9px; letter-spacing:0.2em; display:block">SAFE PADDING</span>12px outer</div>
      <div><span class="dim" style="font-weight:900; font-size:9px; letter-spacing:0.2em; display:block">CELL GAP</span>16px (gap-4)</div>
      <div><span class="dim" style="font-weight:900; font-size:9px; letter-spacing:0.2em; display:block">COLS</span>1fr / 420px</div>
    </div>
  </div>
</body></html>
