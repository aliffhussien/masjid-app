<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:200px">
  <div class="card">
    <div class="label" style="margin-bottom:14px">Theme gradient backdrops</div>
    <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap: 10px;">
      <div>
        <div style="height:100px; background:linear-gradient(135deg,#064e3b 0%, #020617 100%); border-radius:18px; border:1px solid rgba(16,185,129,0.2)"></div>
        <div style="font-size:9px; font-weight:900; margin-top:6px; letter-spacing:0.2em; text-transform:uppercase">Emerald</div>
      </div>
      <div>
        <div style="height:100px; background:linear-gradient(135deg,#1e3a8a 0%, #020617 100%); border-radius:18px; border:1px solid rgba(59,130,246,0.2)"></div>
        <div style="font-size:9px; font-weight:900; margin-top:6px; letter-spacing:0.2em; text-transform:uppercase">Sapphire</div>
      </div>
      <div>
        <div style="height:100px; background:linear-gradient(135deg,#78350f 0%, #020617 100%); border-radius:18px; border:1px solid rgba(245,158,11,0.2)"></div>
        <div style="font-size:9px; font-weight:900; margin-top:6px; letter-spacing:0.2em; text-transform:uppercase">Gold</div>
      </div>
      <div>
        <div style="height:100px; background:linear-gradient(135deg,#881337 0%, #020617 100%); border-radius:18px; border:1px solid rgba(244,63,94,0.2)"></div>
        <div style="font-size:9px; font-weight:900; margin-top:6px; letter-spacing:0.2em; text-transform:uppercase">Ruby</div>
      </div>
      <div>
        <div style="height:100px; background:linear-gradient(135deg,#18181b 0%, #020617 100%); border-radius:18px; border:1px solid rgba(156,163,175,0.2)"></div>
        <div style="font-size:9px; font-weight:900; margin-top:6px; letter-spacing:0.2em; text-transform:uppercase">Steel</div>
      </div>
    </div>
    <div style="margin-top:14px; font-size:11px; color:rgba(255,255,255,0.4)">
      Diagonal <code style="color:rgba(255,255,255,0.6)">135deg</code> gradient · brand 950 → slate 950. Used as fallback when the WebGL sky is disabled.
    </div>
  </div>
</body></html>
