<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="sky-bg" style="height:240px">
  <div class="grain"></div>
  <div class="card" style="position:relative; z-index:1">
    <div class="label" style="margin-bottom:14px; color:rgba(255,255,255,0.6)">Shadow & glow system</div>
    <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:14px; align-items:end;">
      <div>
        <div style="height:80px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.15); border-radius:22px; box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);"></div>
        <div style="font-size:9px; font-weight:900; margin-top:10px; letter-spacing:0.15em">PANEL</div>
        <div class="dim" style="font-size:9px">0 20 50 / inset hl</div>
      </div>
      <div>
        <div style="height:80px; background:#e11d48; border-radius:22px; box-shadow: 0 0 40px rgba(225,29,72,0.55), 0 12px 24px rgba(0,0,0,0.4)"></div>
        <div style="font-size:9px; font-weight:900; margin-top:10px; letter-spacing:0.15em; color:#fda4af">ACTIVE GLOW · ROSE</div>
        <div class="dim" style="font-size:9px">0 0 40 · accent/55</div>
      </div>
      <div>
        <div style="height:80px; background:#059669; border-radius:22px; box-shadow: 0 12px 30px rgba(2,44,34,0.7)"></div>
        <div style="font-size:9px; font-weight:900; margin-top:10px; letter-spacing:0.15em; color:#6ee7b7">CTA · EMERALD</div>
        <div class="dim" style="font-size:9px">0 12 30 · emerald-950/70</div>
      </div>
    </div>
    <div style="margin-top:16px; font-size:11px; color:rgba(255,255,255,0.5)">
      Drop-shadows on TEXT use the same recipe — <code style="color:#fb7185">drop-shadow(0 2px 8px rgba(0,0,0,0.6))</code> is the default for any text over the sky.
    </div>
  </div>
</body></html>
