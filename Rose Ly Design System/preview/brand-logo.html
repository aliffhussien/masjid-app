<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:240px; background:#0a0612">
  <div class="card" style="display:flex; align-items:center; gap:32px">
    <!-- Primary mark at multiple sizes -->
    <div style="display:flex; align-items:flex-end; gap:18px">
      <img src="../assets/logo-mark.png" width="140" height="140" alt="Rose Ly mark">
      <img src="../assets/logo-mark.png" width="72" height="72" alt="Rose Ly mark">
      <img src="../assets/logo-mark.png" width="40" height="40" alt="Rose Ly mark">
    </div>

    <!-- Wordmark -->
    <div style="margin-left:auto; text-align:right">
      <div style="font-weight:900; font-size:56px; line-height:0.95; letter-spacing:-0.045em; font-style:italic; text-transform:uppercase;
                  background: linear-gradient(90deg,#fff 55%,#fda4af 100%);
                  -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Rose Ly</div>
      <div style="font-size:10px; font-weight:900; color:#fda4af; letter-spacing:0.42em; margin-top:10px; text-transform:uppercase">
        Sistem Paparan Masjid Pintar
      </div>
    </div>
  </div>
</body></html>
