<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:260px">
  <div class="card">
    <div class="label" style="margin-bottom:14px">Letter-Spacing System</div>
    <div style="display:flex; flex-direction:column; gap:14px;">
      <div>
        <div class="dim" style="font-size:9px; font-weight:900; letter-spacing:0.2em; margin-bottom:4px">tighter · -0.025em · display</div>
        <div style="font-weight:900; font-size:34px; letter-spacing:-0.025em; text-transform:uppercase">Waktu Seterusnya</div>
      </div>
      <div>
        <div class="dim" style="font-size:9px; font-weight:900; letter-spacing:0.2em; margin-bottom:4px">tightest · -0.04em · countdown</div>
        <div class="tabular" style="font-weight:900; font-size:32px; letter-spacing:-0.04em">00:12:48</div>
      </div>
      <div>
        <div class="dim" style="font-size:9px; font-weight:900; letter-spacing:0.2em; margin-bottom:4px">widest · 0.3em–0.6em · meta labels</div>
        <div style="font-weight:900; font-size:11px; letter-spacing:0.5em; text-transform:uppercase; color:rgba(244,63,94,0.9)">MENUJU SOLAT</div>
      </div>
    </div>
  </div>
</body></html>
