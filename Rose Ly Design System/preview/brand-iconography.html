<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:220px">
  <div class="card">
    <div class="label" style="margin-bottom:14px">Pictograms</div>
    <div style="display:grid; grid-template-columns: repeat(8, 1fr); gap:12px; color:white">
      <!-- search -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px"><svg width="30" height="30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><span style="font-size:9px; font-weight:900; letter-spacing:0.1em; color:rgba(255,255,255,0.45)">Search</span></div>
      <!-- mosque -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px"><svg width="30" height="30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg><span style="font-size:9px; font-weight:900; letter-spacing:0.1em; color:rgba(255,255,255,0.45)">Mosque</span></div>
      <!-- tv -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px"><svg width="30" height="30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg><span style="font-size:9px; font-weight:900; letter-spacing:0.1em; color:rgba(255,255,255,0.45)">Display</span></div>
      <!-- phone -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px"><svg width="30" height="30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg><span style="font-size:9px; font-weight:900; letter-spacing:0.1em; color:rgba(255,255,255,0.45)">Remote</span></div>
      <!-- settings -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px"><svg width="30" height="30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065zM15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg><span style="font-size:9px; font-weight:900; letter-spacing:0.1em; color:rgba(255,255,255,0.45)">Settings</span></div>
      <!-- pin -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px"><svg width="30" height="30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg><span style="font-size:9px; font-weight:900; letter-spacing:0.1em; color:rgba(255,255,255,0.45)">Location</span></div>
      <!-- expand -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px"><svg width="30" height="30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.25" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg><span style="font-size:9px; font-weight:900; letter-spacing:0.1em; color:rgba(255,255,255,0.45)">Expand</span></div>
      <!-- chevron -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px"><svg width="30" height="30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.75" d="M9 5l7 7-7 7"/></svg><span style="font-size:9px; font-weight:900; letter-spacing:0.1em; color:rgba(255,255,255,0.45)">Forward</span></div>
    </div>
    <div style="margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.05); font-size:12px; color:rgba(255,255,255,0.55); line-height:1.45">
      A single weight, single style. Rounded ends and gentle strokes — the dashboard never has to shout.
    </div>
  </div>
</body></html>
