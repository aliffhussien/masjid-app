<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:200px; background:#fafafa">
  <div class="card" style="display:flex; align-items:center; gap:36px">
    <img src="../assets/logo-mark.png" width="120" height="120" alt="Rose Ly mark">
    <div>
      <div style="font-weight:900; font-size:42px; line-height:1; letter-spacing:-0.04em; color:#1c1421; font-style:italic; text-transform:uppercase">Rose Ly</div>
      <div style="font-size:11px; font-weight:900; color:#6e4d75; letter-spacing:0.32em; margin-top:10px; text-transform:uppercase">App</div>
    </div>
    <div style="margin-left:auto; text-align:right; padding-left:18px; border-left:1px solid rgba(0,0,0,0.08)">
      <div style="font-size:9px; font-weight:900; color:rgba(0,0,0,0.35); letter-spacing:0.3em; text-transform:uppercase">Clearance</div>
      <div style="font-size:13px; font-weight:700; color:#1c1421; margin-top:6px; line-height:1.4">
        Keep at least ½× the mark's<br>height clear on every side.
      </div>
    </div>
  </div>
</body></html>
