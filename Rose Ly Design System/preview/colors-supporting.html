<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:200px">
  <div class="card">
    <div class="label" style="margin-bottom:14px">Supporting accents</div>
    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;">
      <div style="background:rgba(16,185,129,0.10); border:1px solid rgba(16,185,129,0.25); border-radius:18px; padding:14px">
        <div style="display:flex; align-items:center; gap:8px"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#10b981"></span><div style="font-weight:900; font-size:11px; letter-spacing:0.2em; color:#34d399">SUCCESS</div></div>
        <div style="font-size:11px; color:rgba(255,255,255,0.4); margin-top:10px; line-height:1.4">Saved, synced, connected. <span style="color:#34d399; font-weight:900">#10b981</span></div>
      </div>
      <div style="background:rgba(245,158,11,0.10); border:1px solid rgba(245,158,11,0.25); border-radius:18px; padding:14px">
        <div style="display:flex; align-items:center; gap:8px"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#f59e0b"></span><div style="font-weight:900; font-size:11px; letter-spacing:0.2em; color:#fbbf24">WAITING</div></div>
        <div style="font-size:11px; color:rgba(255,255,255,0.4); margin-top:10px; line-height:1.4">Iqamah countdown, paused. <span style="color:#fbbf24; font-weight:900">#f59e0b</span></div>
      </div>
      <div style="background:rgba(59,130,246,0.10); border:1px solid rgba(59,130,246,0.25); border-radius:18px; padding:14px">
        <div style="display:flex; align-items:center; gap:8px"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#3b82f6"></span><div style="font-weight:900; font-size:11px; letter-spacing:0.2em; color:#93c5fd">NEWS</div></div>
        <div style="font-size:11px; color:rgba(255,255,255,0.4); margin-top:10px; line-height:1.4">Ticker headlines, information. <span style="color:#93c5fd; font-weight:900">#3b82f6</span></div>
      </div>
      <div style="background:rgba(168,85,247,0.10); border:1px solid rgba(168,85,247,0.25); border-radius:18px; padding:14px">
        <div style="display:flex; align-items:center; gap:8px"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#a855f7"></span><div style="font-weight:900; font-size:11px; letter-spacing:0.2em; color:#c084fc">KHUTBAH</div></div>
        <div style="font-size:11px; color:rgba(255,255,255,0.4); margin-top:10px; line-height:1.4">Friday sermon overlay. <span style="color:#c084fc; font-weight:900">#a855f7</span></div>
      </div>
    </div>
  </div>
</body></html>
