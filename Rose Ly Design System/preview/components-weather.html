<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="sky-bg" style="height:170px">
  <div class="grain"></div>
  <div class="card" style="position:relative; z-index:1; display:flex; align-items:center; gap:32px">
    <!-- live -->
    <div style="display:flex; align-items:center; gap:12px">
      <span style="font-size:34px; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5))">⛅</span>
      <div>
        <div style="font-size:8px; font-weight:900; letter-spacing:0.2em; color:rgba(255,255,255,0.4); text-transform:uppercase">LIVE: KUALA LUMPUR</div>
        <div class="tabular" style="font-weight:900; font-size:26px; letter-spacing:-0.04em; line-height:1; filter:drop-shadow(0 2px 8px rgba(0,0,0,0.6))">32°C</div>
        <div style="font-size:10px; font-weight:700; letter-spacing:0.08em; color:#f43f5e; text-transform:uppercase">Berawan</div>
      </div>
    </div>
    <div style="width:1px; height:60px; background:rgba(255,255,255,0.1)"></div>
    <!-- forecast -->
    <div style="display:flex; align-items:center; gap:12px">
      <span style="font-size:34px; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5))">🌦️</span>
      <div>
        <div style="font-size:8px; font-weight:900; letter-spacing:0.2em; color:rgba(255,255,255,0.4); text-transform:uppercase">ESOK: FORECAST</div>
        <div class="tabular" style="font-weight:900; font-size:22px; letter-spacing:-0.04em; line-height:1; filter:drop-shadow(0 2px 8px rgba(0,0,0,0.6))">26° – 31°C</div>
        <div style="font-size:10px; font-weight:700; letter-spacing:0.08em; color:#f43f5e; text-transform:uppercase">Gerimis</div>
      </div>
    </div>
    <div style="margin-left:auto; text-align:right">
      <div class="label" style="margin-bottom:6px">Auto-rotates · 10s</div>
      <div style="display:flex; gap:5px; justify-content:flex-end">
        <span style="width:18px; height:5px; background:#f43f5e; border-radius:3px"></span>
        <span style="width:5px; height:5px; background:rgba(255,255,255,0.15); border-radius:3px; margin-top:0"></span>
        <span style="width:5px; height:5px; background:rgba(255,255,255,0.15); border-radius:3px"></span>
      </div>
    </div>
  </div>
</body></html>
