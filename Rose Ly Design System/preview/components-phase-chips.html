<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:240px">
  <div class="card">
    <div class="label" style="margin-bottom:14px">Phase chips · simulation grid</div>
    <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px;">
      <button style="padding:14px 8px; background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.05); border-radius:18px; font:inherit; font-weight:900; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer">
        <span style="font-size:22px">⏳</span>Pre Azan
      </button>
      <button style="padding:14px 8px; background:#059669; color:white; border:1px solid #10b981; border-radius:18px; font:inherit; font-weight:900; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; box-shadow: 0 12px 30px rgba(2,44,34,0.6)">
        <span style="font-size:22px">🕌</span>Azan
      </button>
      <button style="padding:14px 8px; background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.05); border-radius:18px; font:inherit; font-weight:900; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer">
        <span style="font-size:22px">🙏</span>Iqamah
      </button>
      <button style="padding:14px 8px; background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.05); border-radius:18px; font:inherit; font-weight:900; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer">
        <span style="font-size:22px">🤲</span>Solat
      </button>
      <button style="padding:14px 8px; background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.05); border-radius:18px; font:inherit; font-weight:900; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer">
        <span style="font-size:22px">📖</span>Khutbah
      </button>
      <button style="padding:14px 8px; background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.05); border-radius:18px; font:inherit; font-weight:900; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer">
        <span style="font-size:22px">🧹</span>Reset
      </button>
    </div>
    <div style="margin-top:12px; font-size:10px; color:rgba(255,255,255,0.4); text-align:center">Emoji + Malay label · admin-only · haptic on tap (20ms)</div>
  </div>
</body></html>
