<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:200px">
  <div class="card">
    <div class="label" style="margin-bottom:14px">Semantic colors</div>
    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:12px;">
      <div style="padding:14px; background:rgba(239,68,68,0.10); border:1px solid rgba(239,68,68,0.3); border-radius:16px">
        <div style="display:flex; align-items:center; gap:8px;"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#ef4444; box-shadow:0 0 12px #ef4444; animation:p 2s infinite"></span><div style="font-weight:900; font-size:11px; letter-spacing:0.2em; color:#fca5a5">LIVE</div></div>
        <div style="font-size:10px; color:rgba(255,255,255,0.4); margin-top:8px">#ef4444</div>
        <div style="font-size:9px; color:rgba(255,255,255,0.3); margin-top:2px">red-500 · live dot</div>
      </div>
      <div style="padding:14px; background:rgba(16,185,129,0.10); border:1px solid rgba(16,185,129,0.3); border-radius:16px">
        <div style="display:flex; align-items:center; gap:8px;"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#10b981"></span><div style="font-weight:900; font-size:11px; letter-spacing:0.2em; color:#6ee7b7">SUCCESS</div></div>
        <div style="font-size:10px; color:rgba(255,255,255,0.4); margin-top:8px">#10b981</div>
        <div style="font-size:9px; color:rgba(255,255,255,0.3); margin-top:2px">Tersimpan · Cloud</div>
      </div>
      <div style="padding:14px; background:rgba(245,158,11,0.10); border:1px solid rgba(245,158,11,0.3); border-radius:16px">
        <div style="display:flex; align-items:center; gap:8px;"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#f59e0b"></span><div style="font-weight:900; font-size:11px; letter-spacing:0.2em; color:#fcd34d">WARN</div></div>
        <div style="font-size:10px; color:rgba(255,255,255,0.4); margin-top:8px">#f59e0b</div>
        <div style="font-size:9px; color:rgba(255,255,255,0.3); margin-top:2px">Pause · Iqamah</div>
      </div>
      <div style="padding:14px; background:rgba(59,130,246,0.10); border:1px solid rgba(59,130,246,0.3); border-radius:16px">
        <div style="display:flex; align-items:center; gap:8px;"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#3b82f6"></span><div style="font-weight:900; font-size:11px; letter-spacing:0.2em; color:#93c5fd">INFO</div></div>
        <div style="font-size:10px; color:rgba(255,255,255,0.4); margin-top:8px">#3b82f6</div>
        <div style="font-size:9px; color:rgba(255,255,255,0.3); margin-top:2px">News badge · Local mode</div>
      </div>
    </div>
  </div>
  <style>@keyframes p { 0%,100%{opacity:1} 50%{opacity:0.4} }</style>
</body></html>
