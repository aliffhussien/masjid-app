<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>

        <h2 style="font-size:18px; font-weight:900; text-transform:uppercase; letter-spacing:-0.025em; margin-bottom:6px">Remote Admin</h2>
        <p style="font-size:10px; font-weight:900; text-transform:uppercase; color:rgba(255,255,255,0.3); letter-spacing:0.05em; line-height:1.5">Kawal paparan melalui telefon bimbit.</p>
      </div>
    </div>
