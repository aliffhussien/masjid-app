<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:200px">
  <div class="card" style="display:flex; align-items:center; gap:28px">

    <!-- Sample: tile with finishing applied -->
    <div style="position:relative; width:160px; height:160px; border-radius:32px; overflow:hidden; flex-shrink:0;
                background:
                  radial-gradient(ellipse at 30% 0%, rgba(255,180,140,0.30), transparent 55%),
                  linear-gradient(180deg, #2a1a45 0%, #0a1024 100%);
                box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.06)">
      <!-- Subtle film grain -->
      <div style="position:absolute; inset:0; opacity:0.03;
                  background-image: url(&quot;data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E&quot;);"></div>
      <!-- Vignette -->
      <div style="position:absolute; inset:0; background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.45) 100%)"></div>
      <div style="position:absolute; left:0; right:0; bottom:14px; text-align:center; font-size:9px; font-weight:900; color:rgba(255,255,255,0.5); letter-spacing:0.3em; text-transform:uppercase; filter:drop-shadow(0 2px 4px black)">A typical frame</div>
    </div>

    <div style="flex:1">
      <div class="label" style="margin-bottom:8px">Cinematic finishing</div>
      <div style="font-weight:900; font-size:22px; letter-spacing:-0.02em; line-height:1.2; text-transform:uppercase; margin-bottom:10px">
        Filmic grain &amp; soft vignette
      </div>
      <p style="margin:0; font-size:12px; font-weight:500; color:rgba(255,255,255,0.55); line-height:1.5; max-width:340px">
        Every screen ships with a barely-there film grain and a gentle edge darkening.
        The effect is subliminal — keeps the dashboard feeling broadcast-quality at any
        size, on any TV.
      </p>
    </div>
  </div>
</body></html>
