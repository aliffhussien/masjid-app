<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="sky-bg" style="height:300px">
  <div class="grain"></div>
  <div class="card" style="position:relative; z-index:1">
    <div class="label" style="margin-bottom:14px; color:rgba(255,255,255,0.5)">Prayer rows · active &amp; inactive</div>
    <div style="display:flex; flex-direction:column; gap:6px">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 22px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.05); border-radius:12px">
        <span style="font-weight:900; font-size:22px; letter-spacing:-0.025em; text-transform:uppercase">Imsak</span>
        <span class="tabular" style="font-weight:900; font-size:24px; letter-spacing:-0.025em">5:40 AM</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 22px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.05); border-radius:12px">
        <span style="font-weight:900; font-size:22px; letter-spacing:-0.025em; text-transform:uppercase">Subuh</span>
        <span class="tabular" style="font-weight:900; font-size:24px; letter-spacing:-0.025em">5:50 AM</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 22px; background:#e11d48; border:1px solid rgba(244,63,94,0.5); border-radius:12px; transform:scale(1.02); box-shadow: 0 0 40px rgba(225,29,72,0.4)">
        <span style="font-weight:900; font-size:22px; letter-spacing:-0.025em; text-transform:uppercase">Zohor</span>
        <span class="tabular" style="font-weight:900; font-size:24px; letter-spacing:-0.025em">1:15 PM</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 22px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.05); border-radius:12px">
        <span style="font-weight:900; font-size:22px; letter-spacing:-0.025em; text-transform:uppercase">Asar</span>
        <span class="tabular" style="font-weight:900; font-size:24px; letter-spacing:-0.025em">4:35 PM</span>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 22px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.05); border-radius:12px">
        <span style="font-weight:900; font-size:22px; letter-spacing:-0.025em; text-transform:uppercase">Maghrib</span>
        <span class="tabular" style="font-weight:900; font-size:24px; letter-spacing:-0.025em">7:22 PM</span>
      </div>
    </div>
  </div>
</body></html>
