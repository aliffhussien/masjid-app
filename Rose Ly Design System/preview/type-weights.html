<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:340px">
  <div class="card">
    <div class="label" style="margin-bottom:18px">Weight Ladder · Outfit</div>
    <div style="display:grid; grid-template-columns: 70px 1fr; gap: 12px 16px; align-items:baseline;">
      <div class="dim" style="font-size:10px; font-weight:900; letter-spacing:0.2em">100</div><div style="font-weight:100; font-size:30px; letter-spacing:-0.025em">Masjid Al-Falah</div>
      <div class="dim" style="font-size:10px; font-weight:900; letter-spacing:0.2em">300</div><div style="font-weight:300; font-size:30px; letter-spacing:-0.025em">Masjid Al-Falah</div>
      <div class="dim" style="font-size:10px; font-weight:900; letter-spacing:0.2em">400</div><div style="font-weight:400; font-size:30px; letter-spacing:-0.025em">Masjid Al-Falah</div>
      <div class="dim" style="font-size:10px; font-weight:900; letter-spacing:0.2em">500</div><div style="font-weight:500; font-size:30px; letter-spacing:-0.025em">Masjid Al-Falah</div>
      <div class="dim" style="font-size:10px; font-weight:900; letter-spacing:0.2em">700</div><div style="font-weight:700; font-size:30px; letter-spacing:-0.025em">Masjid Al-Falah</div>
      <div class="dim" style="font-size:10px; font-weight:900; letter-spacing:0.2em">900</div><div style="font-weight:900; font-size:30px; letter-spacing:-0.025em">Masjid Al-Falah</div>
    </div>
    <div style="margin-top:18px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.06); font-size:11px; color:rgba(255,255,255,0.4)">
      <span style="color:#f43f5e; font-weight:900;">900</span> is the default. Regular weight is reserved for hadith body + slide content.
    </div>
  </div>
</body></html>
